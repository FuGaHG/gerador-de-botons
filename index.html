<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<title>Gerador de Botons 5×5 cm - Folha A4</title>
<!-- Tailwind CSS via CDN -->
<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    darkMode: 'media',
    theme: {
      extend: {
        colors: {
          brand: {
            50: '#EEF0F4',
            500: '#2457D6',
            600: '#1D4ED8',
            700: '#1E40AF'
          }
        }
      }
    }
  }
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    touch-action: manipulation;
  }
  /* Estilização da Folha A4 com Proporção Exata */
  .paper-a4 {
    width: 100%;
    aspect-ratio: 210 / 297;
    position: relative;
    background-color: #ffffff;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08), 0 1px 3px rgba(0, 0, 0, 0.05);
  }
  /* Moldes / Slots de 5x5 cm na folha A4 */
  .button-slot {
    position: absolute;
    width: calc(50 / 210 * 100%);
    height: calc(50 / 297 * 100%);
    overflow: hidden;
    user-select: none;
  }
  .paper-cuts .button-slot {
    outline: 1px dashed #8b8b8b;
  }
</style>
</head>
<body class="bg-gray-100 dark:bg-slate-900 text-gray-900 dark:text-gray-100 min-h-screen flex flex-col pb-28">

  <!-- Cabeçalho -->
  <header class="sticky top-0 z-20 bg-white/80 dark:bg-slate-800/80 backdrop-blur-md border-b border-gray-200 dark:border-slate-700 px-4 py-3">
    <div class="max-w-xl mx-auto flex items-center justify-between">
      <div>
        <h1 class="text-lg font-bold leading-tight">Botons 5×5 cm</h1>
        <p class="text-xs text-gray-500 dark:text-gray-400">Layout A4 (15 por folha)</p>
      </div>
      <span id="photoCount" class="text-xs font-semibold px-2.5 py-1 rounded-full bg-blue-100 text-blue-800 dark:bg-blue-900/60 dark:text-blue-300">
        0 fotos
      </span>
    </div>
  </header>

  <!-- Opções Superiores -->
  <div class="max-w-xl mx-auto w-full px-4 pt-4 pb-2 flex items-center justify-between text-sm">
    <label class="inline-flex items-center gap-2 cursor-pointer select-none">
      <input type="checkbox" id="toggleCutLines" checked class="w-4 h-4 rounded text-blue-600 focus:ring-blue-500">
      <span class="font-medium text-gray-700 dark:text-gray-300">Linhas de corte</span>
    </label>
    <button id="btnClearAll" class="text-xs font-semibold text-red-600 dark:text-red-400 hover:underline">
      Limpar tudo
    </button>
  </div>

  <!-- Área Principal de Exibição das Folhas -->
  <main id="sheetsContainer" class="max-w-xl mx-auto w-full px-4 space-y-6 flex-1 my-2">
    <!-- As folhas A4 virtuais serão geradas aqui dinamicamente -->
  </main>

  <!-- Barra Fixa Inferior com Ações -->
  <div class="fixed bottom-0 left-0 right-0 z-20 bg-white/90 dark:bg-slate-800/90 backdrop-blur-md border-t border-gray-200 dark:border-slate-700 p-4">
    <div class="max-w-xl mx-auto grid grid-cols-2 gap-3">
      <button id="btnAddPhotos" class="flex items-center justify-center gap-2 bg-gray-200 hover:bg-gray-300 dark:bg-slate-700 dark:hover:bg-slate-600 text-gray-900 dark:text-white font-semibold py-3 px-4 rounded-xl transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
        Adicionar Fotos
      </button>
      <button id="btnExportPdf" disabled class="flex items-center justify-center gap-2 bg-blue-600 hover:bg-blue-700 disabled:opacity-50 disabled:cursor-not-allowed text-white font-semibold py-3 px-4 rounded-xl shadow-lg transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
        <span>Baixar PDF</span>
      </button>
    </div>
  </div>

  <!-- Modal de Edição / Ajuste da Imagem -->
  <div id="editorModal" class="fixed inset-0 z-30 hidden bg-black/80 backdrop-blur-sm flex-col justify-between">
    <!-- Topo Modal -->
    <div class="flex items-center justify-between p-4 bg-gray-900 text-white">
      <button id="btnPrevPhoto" class="p-2 rounded-lg hover:bg-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
      </button>
      <span id="editorTitle" class="font-bold text-sm">Editar Foto</span>
      <button id="btnNextPhoto" class="p-2 rounded-lg hover:bg-gray-800">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/></svg>
      </button>
    </div>

    <!-- Palco Principal com Canvas -->
    <div class="flex-1 flex items-center justify-center p-4">
      <div id="canvasFrame" class="relative w-full max-w-xs aspect-square bg-white rounded-lg shadow-2xl overflow-hidden touch-none cursor-grab active:cursor-grabbing">
        <canvas id="editorCanvas" width="600" height="600" class="w-full h-full block"></canvas>
        <div id="guideOverlay" class="absolute inset-0 pointer-events-none border-2 border-dashed border-white/80 rounded-full shadow-[0_0_0_9999px_rgba(0,0,0,0.3)] hidden"></div>
      </div>
    </div>

    <!-- Controles de Edição -->
    <div class="bg-gray-900 text-white p-4 space-y-4 max-w-xl mx-auto w-full rounded-t-2xl">
      <!-- Slider de Zoom -->
      <div class="flex items-center gap-3">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM13 11H7"/></svg>
        <input type="range" id="zoomRange" min="0.5" max="3" step="0.01" value="1" class="w-full accent-blue-500 h-2 bg-gray-700 rounded-lg">
        <svg class="w-5 h-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v6m3-3H7"/></svg>
      </div>

      <!-- Barra de Ferramentas -->
      <div class="grid grid-cols-4 gap-2 text-xs text-center font-medium">
        <button id="btnToggleFit" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-xl flex flex-col items-center gap-1 border border-gray-700">
          <svg class="w-5 h-5 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-2V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"/></svg>
          <span id="lblFitMode">Esticar</span>
        </button>
        <button id="btnRotate" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-xl flex flex-col items-center gap-1 border border-gray-700">
          <svg class="w-5 h-5 text-emerald-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/></svg>
          <span>Girar</span>
        </button>
        <button id="btnToggleGuide" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-xl flex flex-col items-center gap-1 border border-gray-700">
          <svg class="w-5 h-5 text-yellow-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 010 2.83 2 2 0 01-2.83 0l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 01-2 2 2 2 0 01-2-2v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 01-2.83 0 2 2 0 010-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 01-2-2 2 2 0 012-2h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 010-2.83 2 2 0 012.83 0l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 012-2 2 2 0 012 2v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 012.83 0 2 2 0 010 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 012 2 2 2 0 01-2 2h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
          <span>Guia</span>
        </button>
        <button id="btnReplacePhoto" class="bg-gray-800 hover:bg-gray-700 p-2.5 rounded-xl flex flex-col items-center gap-1 border border-gray-700">
          <svg class="w-5 h-5 text-purple-400" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z"/></svg>
          <span>Trocar</span>
        </button>
      </div>

      <!-- Ações Finais -->
      <div class="grid grid-cols-2 gap-3 pt-2">
        <button id="btnRemovePhoto" class="bg-red-900/40 hover:bg-red-900/60 text-red-300 font-semibold py-3 rounded-xl border border-red-700/50">
          Remover
        </button>
        <button id="btnCloseEditor" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-xl">
          Pronto
        </button>
      </div>
    </div>
  </div>

  <!-- Elemento de Input de Arquivo Oculto -->
  <input type="file" id="fileInput" accept="image/*" multiple class="hidden">

  <!-- Notificação Toast -->
  <div id="toast" class="fixed bottom-24 left-1/2 -translate-x-1/2 z-40 bg-gray-900 text-white text-xs font-semibold px-4 py-2.5 rounded-full shadow-lg opacity-0 transition-opacity duration-200 pointer-events-none"></div>

  <!-- Lógica Principal em Javascript -->
  <script>
    (() => {
      // Configurações de Dimensões
      const SLOTS_PER_PAGE = 15;
      const COLS = 3;
      const ROWS = 5;
      const A4_MM = { w: 210, h: 297 };
      const SLOT_MM = 50; // 5 x 5 cm
      const GAP_MM = 3;   // Espaçamento entre os botons

      // Cálculo das Margens para Centralizar a Grade na Folha A4
      const GRID_W = COLS * SLOT_MM + (COLS - 1) * GAP_MM; // 156mm
      const GRID_H = ROWS * SLOT_MM + (ROWS - 1) * GAP_MM; // 262mm
      const X0 = (A4_MM.w - GRID_W) / 2;
      const Y0 = (A4_MM.h - GRID_H) / 2;

      // Elementos do DOM
      const sheetsContainer = document.getElementById('sheetsContainer');
      const fileInput = document.getElementById('fileInput');
      const photoCountEl = document.getElementById('photoCount');
      const toggleCutLines = document.getElementById('toggleCutLines');
      const btnExportPdf = document.getElementById('btnExportPdf');
      const toastEl = document.getElementById('toast');

      // Modal de Edição e Canvas
      const editorModal = document.getElementById('editorModal');
      const editorCanvas = document.getElementById('editorCanvas');
      const editorCtx = editorCanvas.getContext('2d');
      const zoomRange = document.getElementById('zoomRange');
      const lblFitMode = document.getElementById('lblFitMode');
      const guideOverlay = document.getElementById('guideOverlay');

      // Estado Global da Aplicação
      let items = []; // Armazena os objetos das fotos { img, w, h, zoom, ox, oy, rot, fitMode }
      let activeIndex = -1;
      let targetSlotIndex = null;
      let isReplacing = false;

      // Exibe mensagens rápidas no ecrã
      function showToast(msg) {
        toastEl.textContent = msg;
        toastEl.classList.remove('opacity-0');
        clearTimeout(showToast.timer);
        showToast.timer = setTimeout(() => toastEl.classList.add('opacity-0'), 2500);
      }

      // Utilitários de Cálculo
      const countFilled = () => items.filter(Boolean).length;
      const getLastFilledIndex = () => {
        for (let i = items.length - 1; i >= 0; i--) {
          if (items[i]) return i;
        }
        return -1;
      };
      const getPageCount = () => Math.max(1, Math.ceil((getLastFilledIndex() + 1) / SLOTS_PER_PAGE));

      // Posição de cada slot (em mm) na folha A4
      const getSlotPosition = (index) => {
        const slotInPage = index % SLOTS_PER_PAGE;
        const col = slotInPage % COLS;
        const row = Math.floor(slotInPage / COLS);
        return {
          x: X0 + col * (SLOT_MM + GAP_MM),
          y: Y0 + row * (SLOT_MM + GAP_MM)
        };
      };

      // Carrega um ficheiro de imagem e otimiza para canvas
      async function processImageFile(file) {
        return new Promise((resolve, reject) => {
          const img = new Image();
          const url = URL.createObjectURL(file);
          img.onload = () => {
            URL.revokeObjectURL(url);
            // Redimensiona se a foto for extremamente grande para otimizar desempenho
            const maxDimension = 2000;
            let w = img.width;
            let h = img.height;
            if (w > maxDimension || h > maxDimension) {
              const scale = maxDimension / Math.max(w, h);
              w = Math.round(w * scale);
              h = Math.round(h * scale);
            }
            const canvas = document.createElement('canvas');
            canvas.width = w;
            canvas.height = h;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, w, h);

            resolve({
              img: canvas,
              w: w,
              h: h,
              zoom: 1.0,
              ox: 0,
              oy: 0,
              rot: 0,
              fitMode: 'stretch' // 'stretch' = Preencher/Esticar 5x5 por padrão
            });
          };
          img.onerror = () => {
            URL.revokeObjectURL(url);
            reject(new Error('Erro ao carregar a imagem.'));
          };
          img.src = url;
        });
      }

      // Função de Desenho Central (Desenha no slot da folha ou no editor)
      function drawSlotContent(ctx, item, sizePx) {
        ctx.save();
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, sizePx, sizePx);

        if (item && item.img) {
          ctx.beginPath();
          ctx.rect(0, 0, sizePx, sizePx);
          ctx.clip();

          ctx.imageSmoothingEnabled = true;
          ctx.imageSmoothingQuality = 'high';

          const rotRad = (item.rot * 90) * Math.PI / 180;
          const isRotatedVertical = item.rot % 2 !== 0;
          const effW = isRotatedVertical ? item.h : item.w;
          const effH = isRotatedVertical ? item.w : item.h;

          ctx.translate(sizePx / 2 + item.ox * sizePx, sizePx / 2 + item.oy * sizePx);
          ctx.rotate(rotRad);

          if (item.fitMode === 'contain') {
            // Encaixe Proporcional com margens
            const baseScale = Math.min(sizePx / effW, sizePx / effH);
            const scale = baseScale * item.zoom;
            ctx.scale(scale, scale);
            ctx.drawImage(item.img, -item.w / 2, -item.h / 2);
          } else {
            // Modo Esticar / Preencher Exato (Padrão 5x5 cm)
            const scaleX = (sizePx / effW) * item.zoom;
            const scaleY = (sizePx / effH) * item.zoom;
            ctx.scale(scaleX, scaleY);
            ctx.drawImage(item.img, -item.w / 2, -item.h / 2);
          }
        }
        ctx.restore();
      }

      // Renderiza as folhas A4 e os botons na interface
      function renderSheets() {
        const pages = getPageCount();
        sheetsContainer.innerHTML = '';

        for (let p = 0; p < pages; p++) {
          const wrapper = document.createElement('div');
          wrapper.className = 'space-y-1';

          if (pages > 1) {
            const label = document.createElement('p');
            label.className = 'text-xs font-medium text-gray-500 dark:text-gray-400 pl-1';
            label.textContent = `Folha ${p + 1} de ${pages}`;
            wrapper.appendChild(label);
          }

          const paper = document.createElement('div');
          paper.className = `paper-a4 rounded-lg overflow-hidden border border-gray-200 dark:border-slate-700 ${toggleCutLines.checked ? 'paper-cuts' : ''}`;

          for (let k = 0; k < SLOTS_PER_PAGE; k++) {
            const index = p * SLOTS_PER_PAGE + k;
            const pos = getSlotPosition(index);

            const slotBtn = document.createElement('button');
            slotBtn.type = 'button';
            slotBtn.className = 'button-slot flex items-center justify-center bg-gray-50 dark:bg-slate-800/50 hover:opacity-90 transition';
            slotBtn.style.left = `${(pos.x / A4_MM.w) * 100}%`;
            slotBtn.style.top = `${(pos.y / A4_MM.h) * 100}%`;

            if (items[index]) {
              const canvas = document.createElement('canvas');
              canvas.width = 200;
              canvas.height = 200;
              canvas.className = 'w-full h-full block';
              drawSlotContent(canvas.getContext('2d'), items[index], 200);
              slotBtn.appendChild(canvas);
              slotBtn.onclick = () => openEditor(index);
            } else {
              slotBtn.innerHTML = `
                <svg class="w-6 h-6 text-gray-300 dark:text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                  <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
                </svg>`;
              slotBtn.onclick = () => {
                targetSlotIndex = index;
                isReplacing = false;
                fileInput.click();
              };
            }
            paper.appendChild(slotBtn);
          }
          wrapper.appendChild(paper);
          sheetsContainer.appendChild(wrapper);
        }

        // Atualiza indicadores e estado do botão de PDF
        const total = countFilled();
        photoCountEl.textContent = `${total} ${total === 1 ? 'foto' : 'fotos'}`;
        btnExportPdf.disabled = total === 0;
      }

      // Gestão do Carregamento de Ficheiros
      fileInput.addEventListener('change', async () => {
        const files = Array.from(fileInput.files).filter(f => f.type.startsWith('image/'));
        fileInput.value = '';
        if (!files.length) return;

        showToast('Processando foto(s)...');
        const loadedItems = [];
        for (const file of files) {
          try {
            const item = await processImageFile(file);
            loadedItems.push(item);
          } catch (err) {
            showToast('Erro ao abrir uma das imagens.');
          }
        }

        if (!loadedItems.length) return;

        if (isReplacing && targetSlotIndex !== null) {
          items[targetSlotIndex] = loadedItems[0];
          isReplacing = false;
          if (activeIndex === targetSlotIndex) openEditor(targetSlotIndex);
        } else {
          let curr = targetSlotIndex !== null ? targetSlotIndex : 0;
          targetSlotIndex = null;
          for (const item of loadedItems) {
            while (items[curr]) curr++;
            items[curr] = item;
            curr++;
          }
        }
        renderSheets();
        showToast('Fotos adicionadas com sucesso!');
      });

      // Ações dos Botões Principais
      document.getElementById('btnAddPhotos').onclick = () => {
        targetSlotIndex = null;
        isReplacing = false;
        fileInput.click();
      };

      document.getElementById('btnClearAll').onclick = () => {
        if (!countFilled()) return;
        if (confirm('Deseja remover todas as fotos da folha?')) {
          items = [];
          renderSheets();
          showToast('Folhas limpas.');
        }
      };

      toggleCutLines.onchange = () => renderSheets();

      // Controlos do Modal de Edição
      function openEditor(index) {
        if (!items[index]) return;
        activeIndex = index;
        const item = items[index];

        document.getElementById('editorTitle').textContent = `Ajustar Foto ${index + 1}`;
        zoomRange.value = item.zoom;
        lblFitMode.textContent = item.fitMode === 'stretch' ? 'Esticar' : 'Encaixar';

        // Atualiza navegadores do modal
        document.getElementById('btnPrevPhoto').disabled = !items.slice(0, index).some(Boolean);
        document.getElementById('btnNextPhoto').disabled = !items.slice(index + 1).some(Boolean);

        editorModal.classList.remove('hidden');
        editorModal.classList.add('flex');
        drawEditor();
      }

      function closeEditor() {
        editorModal.classList.add('hidden');
        editorModal.classList.remove('flex');
        activeIndex = -1;
        renderSheets();
      }

      function drawEditor() {
        if (activeIndex < 0 || !items[activeIndex]) return;
        drawSlotContent(editorCtx, items[activeIndex], editorCanvas.width);
      }

      document.getElementById('btnCloseEditor').onclick = closeEditor;
      document.getElementById('btnPrevPhoto').onclick = () => {
        let i = activeIndex - 1;
        while (i >= 0 && !items[i]) i--;
        if (i >= 0) openEditor(i);
      };
      document.getElementById('btnNextPhoto').onclick = () => {
        let i = activeIndex + 1;
        while (i < items.length && !items[i]) i++;
        if (i < items.length) openEditor(i);
      };

      // Alterna entre modo Esticar (Preencher 5x5) e Encaixar Proporcional
      document.getElementById('btnToggleFit').onclick = () => {
        const item = items[activeIndex];
        if (!item) return;
        item.fitMode = item.fitMode === 'stretch' ? 'contain' : 'stretch';
        item.zoom = 1.0;
        item.ox = 0;
        item.oy = 0;
        zoomRange.value = 1.0;
        lblFitMode.textContent = item.fitMode === 'stretch' ? 'Esticar' : 'Encaixar';
        drawEditor();
      };

      // Rotação da Foto
      document.getElementById('btnRotate').onclick = () => {
        const item = items[activeIndex];
        if (!item) return;
        item.rot = (item.rot + 1) % 4;
        drawEditor();
      };

      // Mostrar/Ocultar Guia Redonda de Boton
      document.getElementById('btnToggleGuide').onclick = () => {
        guideOverlay.classList.toggle('hidden');
      };

      // Trocar Imagem do Slot Ativo
      document.getElementById('btnReplacePhoto').onclick = () => {
        targetSlotIndex = activeIndex;
        isReplacing = true;
        fileInput.click();
      };

      // Remover Imagem do Slot Ativo
      document.getElementById('btnRemovePhoto').onclick = () => {
        if (activeIndex < 0) return;
        items[activeIndex] = undefined;
        // Limpa espaços vazios no final da lista
        while (items.length && !items[items.length - 1]) items.pop();
        closeEditor();
      };

      // Evento de Ajuste pelo Slider
      zoomRange.oninput = () => {
        const item = items[activeIndex];
        if (!item) return;
        item.zoom = parseFloat(zoomRange.value);
        drawEditor();
      };

      // Interação de Arraste e Mover a Imagem no Canvas
      let isDragging = false;
      let startX = 0, startY = 0;

      const canvasFrame = document.getElementById('canvasFrame');

      canvasFrame.addEventListener('pointerdown', (e) => {
        if (activeIndex < 0) return;
        isDragging = true;
        startX = e.clientX;
        startY = e.clientY;
        canvasFrame.setPointerCapture(e.pointerId);
      });

      canvasFrame.addEventListener('pointermove', (e) => {
        if (!isDragging || activeIndex < 0) return;
        const item = items[activeIndex];
        const rect = canvasFrame.getBoundingClientRect();
        const deltaX = (e.clientX - startX) / rect.width;
        const deltaY = (e.clientY - startY) / rect.height;

        item.ox += deltaX;
        item.oy += deltaY;

        startX = e.clientX;
        startY = e.clientY;
        drawEditor();
      });

      const stopDrag = (e) => {
        if (isDragging) {
          isDragging = false;
          try { canvasFrame.releasePointerCapture(e.pointerId); } catch(err){}
        }
      };

      canvasFrame.addEventListener('pointerup', stopDrag);
      canvasFrame.addEventListener('pointercancel', stopDrag);

      // Suporte para Roda do Rato no Zoom
      canvasFrame.addEventListener('wheel', (e) => {
        e.preventDefault();
        const item = items[activeIndex];
        if (!item) return;
        const delta = e.deltaY < 0 ? 0.05 : -0.05;
        item.zoom = Math.min(3.0, Math.max(0.5, item.zoom + delta));
        zoomRange.value = item.zoom;
        drawEditor();
      }, { passive: false });

      // EXPORTAÇÃO PDF A4 EM ALTA RESOLUÇÃO (300 DPI)
      const DPI = 300;
      const mmToPx = (mm) => Math.round((mm / 25.4) * DPI);

      // Renderiza uma folha A4 em alta definição para o PDF
      function renderHighResPage(pageIndex) {
        const canvas = document.createElement('canvas');
        canvas.width = mmToPx(A4_MM.w);  // ~2480 px
        canvas.height = mmToPx(A4_MM.h); // ~3508 px
        const ctx = canvas.getContext('2d');

        // Fundo Branco
        ctx.fillStyle = '#FFFFFF';
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        const slotPx = mmToPx(SLOT_MM);

        for (let k = 0; k < SLOTS_PER_PAGE; k++) {
          const index = pageIndex * SLOTS_PER_PAGE + k;
          const item = items[index];
          const pos = getSlotPosition(index);
          const xPx = mmToPx(pos.x);
          const yPx = mmToPx(pos.y);

          if (item) {
            const slotCanvas = document.createElement('canvas');
            slotCanvas.width = slotPx;
            slotCanvas.height = slotPx;
            drawSlotContent(slotCanvas.getContext('2d'), item, slotPx);
            ctx.drawImage(slotCanvas, xPx, yPx);
          }

          // Linhas de Corte
          if (toggleCutLines.checked && item) {
            ctx.strokeStyle = '#8B8B8B';
            ctx.lineWidth = 2;
            ctx.strokeRect(xPx - 1, yPx - 1, slotPx + 2, slotPx + 2);
          }
        }
        return canvas;
      }

      // Converte Canvas para ArrayBuffer JPEG
      function canvasToJpegBuffer(canvas) {
        return new Promise((resolve) => {
          canvas.toBlob((blob) => {
            blob.arrayBuffer().then((buffer) => resolve(new Uint8Array(buffer)));
          }, 'image/jpeg', 0.92);
        });
      }

      // Construtor nativo de PDF sem dependências externas
      function buildPdfDocument(pagesData) {
        const encoder = new TextEncoder();
        const chunks = [];
        const offsets = [];
        let currentOffset = 0;

        const write = (data) => {
          const buffer = typeof data === 'string' ? encoder.encode(data) : data;
          chunks.push(buffer);
          currentOffset += buffer.length;
        };

        const startObj = (id) => {
          offsets[id] = currentOffset;
          write(`${id} 0 obj\n`);
        };

        const pdfWidth = 595.28;  // A4 em pontos PDF
        const pdfHeight = 841.89;
        const totalPages = pagesData.length;

        write('%PDF-1.4\n');
        startObj(1); write('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
        startObj(2); write(`<< /Type /Pages /Count ${totalPages} /Kids [${pagesData.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] >>\nendobj\n`);

        pagesData.forEach((page, i) => {
          const pageObjId = 3 + i * 3;
          const contentObjId = pageObjId + 1;
          const imageObjId = pageObjId + 2;

          startObj(pageObjId);
          write(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${pdfWidth} ${pdfHeight}] /Resources << /XObject << /Im0 ${imageObjId} 0 R >> >> /Contents ${contentObjId} 0 R >>\nendobj\n`);

          const streamContent = `q ${pdfWidth} 0 0 ${pdfHeight} 0 0 cm /Im0 Do Q`;
          startObj(contentObjId);
          write(`<< /Length ${streamContent.length} >>\nstream\n${streamContent}\nendstream\nendobj\n`);

          startObj(imageObjId);
          write(`<< /Type /XObject /Subtype /Image /Width ${page.w} /Height ${page.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${page.bytes.length} >>\nstream\n`);
          write(page.bytes);
          write('\nendstream\nendobj\n');
        });

        const totalObjects = 3 + totalPages * 3;
        const xrefOffset = currentOffset;
        write(`xref\n0 ${totalObjects}\n0000000000 65535 f \n`);

        for (let id = 1; id < totalObjects; id++) {
          write(String(offsets[id]).padStart(10, '0') + ' 00000 n \n');
        }

        write(`trailer\n<< /Size ${totalObjects} /Root 1 0 R >>\nstartxref\n${xrefOffset}\n%%EOF`);
        return new Blob(chunks, { type: 'application/pdf' });
      }

      // Evento de Exportação PDF
      btnExportPdf.onclick = async () => {
        btnExportPdf.disabled = true;
        showToast('A gerar o PDF em alta resolução...');

        setTimeout(async () => {
          try {
            const pagesCount = getPageCount();
            const pagesData = [];

            for (let p = 0; p < pagesCount; p++) {
              const canvas = renderHighResPage(p);
              const bytes = await canvasToJpegBuffer(canvas);
              pagesData.push({ w: canvas.width, h: canvas.height, bytes });
            }

            const pdfBlob = buildPdfDocument(pagesData);
            const downloadUrl = URL.createObjectURL(pdfBlob);

            const link = document.createElement('a');
            link.href = downloadUrl;
            link.download = 'folha-botons-5x5-A4.pdf';
            document.body.appendChild(link);
            link.click();
            link.remove();

            setTimeout(() => URL.revokeObjectURL(downloadUrl), 10000);
            showToast('PDF descarregado com sucesso!');
          } catch (err) {
            console.error(err);
            showToast('Erro ao gerar o PDF.');
          } finally {
            btnExportPdf.disabled = countFilled() === 0;
          }
        }, 100);
      };

      // Inicialização da Aplicação
      renderSheets();

    })();
  </script>
</body>
</html>
