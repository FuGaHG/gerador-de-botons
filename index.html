<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2457D6">
<title>Folha de botons 5×5</title>
<style>
:root {
  --bg: #EEF0F4;
  --surface: #FFFFFF;
  --ink: #14171F;
  --muted: #667085;
  --line: #D5DAE3;
  --accent: #2457D6;
  --on-accent: #FFFFFF;
  --soft: #E6ECFB;
  --danger: #C62828;
  --font: Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  color-scheme: light dark;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0E121A;
    --surface: #1A2030;
    --ink: #F1F3F8;
    --muted: #9AA4B8;
    --line: #313A4E;
    --accent: #5B86F0;
    --on-accent: #0B1226;
    --soft: #243256;
    --danger: #FF8A80;
  }
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { font-family: var(--font); background: var(--bg); color: var(--ink); }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; }
button:focus-visible, input:focus-visible, label:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }

/* Topo */
.top { position: sticky; top: 0; z-index: 5; background: var(--bg); padding: calc(10px + env(safe-area-inset-top)) 16px 10px; display: flex; align-items: center; gap: 12px; }
.top h1 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; flex: 1; }
.count { font-size: .85rem; color: var(--muted); }
.chip { display: inline-flex; align-items: center; gap: 7px; padding: 8px 12px; border-radius: 99px; background: var(--surface); border: 1px solid var(--line); font-size: .85rem; font-weight: 600; }
.chip input { accent-color: var(--accent); width: 16px; height: 16px; margin: 0; }
.chip.btn { color: var(--muted); }

/* Folhas */
main { max-width: 520px; margin: 0 auto; padding: 4px 16px calc(110px + env(safe-area-inset-bottom)); display: grid; gap: 22px; }
.sheet-label { font-size: .8rem; color: var(--muted); margin: 0 0 8px 2px; }
.paper { position: relative; width: 100%; aspect-ratio: 210 / 297; background: #fff; border-radius: 4px; box-shadow: 0 1px 3px rgb(16 24 40 / .12), 0 8px 24px rgb(16 24 40 / .08); overflow: hidden; }
.slot { position: absolute; width: calc(50 / 210 * 100%); height: calc(50 / 297 * 100%); padding: 0; background: #F6F7F9; border-radius: 0; overflow: hidden; display: block; }
.paper.cuts .slot { outline: 1px solid #9AA1AE; }
.slot canvas { width: 100%; height: 100%; display: block; }
.slot.empty { display: grid; place-items: center; color: #98A0AE; outline: 1px dashed #B9C0CC; }
.slot.empty svg { width: 28%; height: 28%; }
.slot:active { filter: brightness(.94); }

/* Barra inferior */
.bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px); border-top: 1px solid var(--line); }
.bar-inner { max-width: 520px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1.4fr; gap: 10px; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 50px; padding: 0 18px; border-radius: 14px; font-weight: 700; font-size: 1rem; }
.btn svg { width: 20px; height: 20px; flex: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); }
.btn.secondary { background: var(--soft); color: var(--accent); }
.btn:disabled { opacity: .45; cursor: default; }

/* Editor */
.editor { position: fixed; inset: 0; z-index: 20; background: var(--bg); display: none; flex-direction: column; }
.editor.open { display: flex; }
.ed-head { display: flex; align-items: center; justify-content: space-between; padding: calc(10px + env(safe-area-inset-top)) 12px 6px; }
.ed-title { font-weight: 700; font-size: .95rem; }
.icon { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; color: var(--ink); }
.icon svg { width: 22px; height: 22px; }
.icon:disabled { opacity: .3; }
.ed-stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 8px 16px; }
.frame { position: relative; width: min(100%, 100cqh); aspect-ratio: 1; }
.ed-stage { container-type: size; }
.frame { width: min(100cqw, 100cqh); }
.frame canvas { width: 100%; height: 100%; display: block; background: #fff; border-radius: 6px; touch-action: none; cursor: grab; box-shadow: 0 8px 30px rgb(16 24 40 / .2); }
.frame canvas:active { cursor: grabbing; }
.guide { position: absolute; inset: 0; pointer-events: none; border-radius: 50%; border: 2px dashed rgb(255 255 255 / .9); box-shadow: 0 0 0 1px rgb(0 0 0 / .35), 0 0 0 999px rgb(0 0 0 / .0); display: none; }
.frame.show-guide .guide { display: block; }
.ed-controls { padding: 8px 16px calc(14px + env(safe-area-inset-bottom)); max-width: 520px; width: 100%; margin: 0 auto; display: grid; gap: 12px; }
.zoom-row { display: flex; align-items: center; gap: 12px; }
.zoom-row svg { width: 20px; height: 20px; color: var(--muted); flex: none; }
input[type=range] { flex: 1; accent-color: var(--accent); height: 34px; }
.tools { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; }
.tool { display: grid; justify-items: center; gap: 4px; padding: 8px 2px; border-radius: 12px; font-size: .75rem; font-weight: 600; color: var(--ink); }
.tool svg { width: 22px; height: 22px; }
.tool[aria-pressed=true] { background: var(--soft); color: var(--accent); }
.tool.danger { color: var(--danger); }
.ed-actions { display: grid; grid-template-columns: 1fr; }

/* Aviso */
.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translateX(-50%); z-index: 30; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: .88rem; font-weight: 600; max-width: 90vw; text-align: center; opacity: 0; pointer-events: none; transition: opacity .2s; }
.toast.show { opacity: 1; }
input[type=file] { display: none; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>

<header class="top">
  <h1>Botons 5×5</h1>
  <span class="count" id="count">0 fotos</span>
</header>

<div style="max-width:520px;margin:0 auto;padding:0 16px 12px;display:flex;gap:8px;flex-wrap:wrap">
  <label class="chip"><input type="checkbox" id="cuts" checked> Linhas de corte</label>
  <button class="chip btn" id="clear" type="button">Limpar tudo</button>
</div>

<main id="sheets"></main>

<div class="bar">
  <div class="bar-inner">
    <button class="btn secondary" id="add" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      Fotos
    </button>
    <button class="btn primary" id="export" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0-4-4m4 4 4-4M5 19h14"/></svg>
      <span id="exportLabel">Baixar PDF</span>
    </button>
  </div>
</div>

<!-- Editor -->
<section class="editor" id="editor" role="dialog" aria-modal="true" aria-label="Ajustar foto">
  <div class="ed-head">
    <button class="icon" id="prev" type="button" aria-label="Foto anterior">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 6-6 6 6 6"/></svg>
    </button>
    <span class="ed-title" id="edTitle">Foto 1</span>
    <button class="icon" id="next" type="button" aria-label="Próxima foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>
    </button>
  </div>
  <div class="ed-stage">
    <div class="frame" id="frame">
      <canvas id="edCanvas" width="700" height="700"></canvas>
      <div class="guide"></div>
    </div>
  </div>
  <div class="ed-controls">
    <div class="zoom-row">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M20 20l-4-4"/></svg>
      <input type="range" id="zoom" min="0.2" max="4" step="0.01" value="1" aria-label="Tamanho da foto">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="6"/><path d="M8 11h6M11 8v6M20 20l-4-4"/></svg>
    </div>
    <div class="tools">
      <button class="tool" id="fill" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>Preencher
      </button>
      <button class="tool" id="rotate" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 12a8 8 0 1 1-2.5-5.8M20 4v5h-5"/></svg>Girar
      </button>
      <button class="tool" id="guide" type="button" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-dasharray="3 3"><circle cx="12" cy="12" r="8"/></svg>Guia
      </button>
      <button class="tool" id="swap" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="5" width="16" height="14" rx="2"/><path d="m4 16 5-5 4 4 3-3 4 4"/></svg>Trocar
      </button>
    </div>
    <div style="display:grid;grid-template-columns:1fr 2fr;gap:10px">
      <button class="btn secondary tool danger" id="remove" type="button" style="font-size:1rem;display:inline-flex;grid-template-columns:none">Remover</button>
      <button class="btn primary" id="done" type="button">Pronto</button>
    </div>
  </div>
</section>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<input type="file" id="file" accept="image/*" multiple>

<script>
(() => {
  const PER_PAGE = 15, COLS = 3;
  const A4 = { w: 210, h: 297 }, CELL = 50, GAP = 3;
  const GRID_W = COLS * CELL + (COLS - 1) * GAP;        // 156 mm
  const GRID_H = 5 * CELL + 4 * GAP;                     // 262 mm
  const X0 = (A4.w - GRID_W) / 2, Y0 = (A4.h - GRID_H) / 2;
  const MAX_SIDE = 2400;                                 // reduz fotos grandes (memória do celular)

  const $ = id => document.getElementById(id);
  const sheetsEl = $('sheets'), fileEl = $('file'), toastEl = $('toast');
  const ed = { canvas: $('edCanvas'), frame: $('frame'), zoom: $('zoom'), idx: -1 };

  /** items[i] = { img: canvas, w, h, zoom, ox, oy, rot } | undefined */
  let items = [];
  let pendingIndex = null, replaceMode = false;

  /* ---------- utilidades ---------- */
  function toast(msg) {
    toastEl.textContent = msg; toastEl.classList.add('show');
    clearTimeout(toast.t); toast.t = setTimeout(() => toastEl.classList.remove('show'), 2400);
  }
  const lastFilled = () => { for (let i = items.length - 1; i >= 0; i--) if (items[i]) return i; return -1; };
  const filledCount = () => items.filter(Boolean).length;
  const pageCount = () => Math.max(1, Math.ceil((lastFilled() + 1) / PER_PAGE));
  const slotPos = i => {
    const p = i % PER_PAGE, col = p % COLS, row = Math.floor(p / COLS);
    return { x: X0 + col * (CELL + GAP), y: Y0 + row * (CELL + GAP) };
  };
  const dims = it => (it.rot % 2 ? { w: it.h, h: it.w } : { w: it.w, h: it.h });
  const coverScale = (it, S) => { const d = dims(it); return Math.max(S / d.w, S / d.h); };

  /** Mantém a foto dentro de limites razoáveis (nunca "foge" do quadrado). */
  function clamp(it) {
    const d = dims(it), cover = coverScale(it, 1);
    const s = cover * it.zoom;
    const lx = Math.max(0, (d.w * s - 1) / 2), ly = Math.max(0, (d.h * s - 1) / 2);
    it.ox = Math.min(lx, Math.max(-lx, it.ox));
    it.oy = Math.min(ly, Math.max(-ly, it.oy));
  }

  /** Desenha um quadrado de S×S px. Mesma função para prévia, editor e PDF. */
  function drawItem(ctx, it, S) {
    ctx.save();
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, S, S);
    if (it) {
      ctx.beginPath(); ctx.rect(0, 0, S, S); ctx.clip();
      const s = coverScale(it, S) * it.zoom;
      ctx.translate(S / 2 + it.ox * S, S / 2 + it.oy * S);
      ctx.rotate(it.rot * Math.PI / 2);
      ctx.scale(s, s);
      ctx.imageSmoothingQuality = 'high';
      ctx.drawImage(it.img, -it.w / 2, -it.h / 2);
    }
    ctx.restore();
  }

  /* ---------- importação ---------- */
  async function loadImage(file) {
    let src;
    try { src = await createImageBitmap(file, { imageOrientation: 'from-image' }); }
    catch {
      src = await new Promise((res, rej) => {
        const im = new Image(), url = URL.createObjectURL(file);
        im.onload = () => { URL.revokeObjectURL(url); res(im); };
        im.onerror = () => { URL.revokeObjectURL(url); rej(); };
        im.src = url;
      });
    }
    const sw = src.width, sh = src.height, k = Math.min(1, MAX_SIDE / Math.max(sw, sh));
    const c = document.createElement('canvas');
    c.width = Math.round(sw * k); c.height = Math.round(sh * k);
    c.getContext('2d').drawImage(src, 0, 0, c.width, c.height);
    if (src.close) src.close();
    return { img: c, w: c.width, h: c.height, zoom: 1, ox: 0, oy: 0, rot: 0 };
  }

  fileEl.addEventListener('change', async () => {
    const files = [...fileEl.files].filter(f => f.type.startsWith('image/'));
    fileEl.value = '';
    if (!files.length) return;
    toast('Carregando…');
    const loaded = [];
    for (const f of files) {
      try { loaded.push(await loadImage(f)); } catch { toast('Não foi possível abrir ' + f.name); }
    }
    if (!loaded.length) return;

    if (replaceMode && pendingIndex !== null) {
      const old = items[pendingIndex];
      items[pendingIndex] = loaded[0];
      replaceMode = false;
      render();
      if (ed.idx === pendingIndex) openEditor(pendingIndex);
      pendingIndex = null;
      return;
    }
    // Preenche os espaços vazios a partir do escolhido (ou do primeiro vazio) e cria novas folhas se faltar.
    let i = pendingIndex ?? 0;
    pendingIndex = null;
    for (const it of loaded) {
      while (items[i]) i++;
      items[i] = it; i++;
    }
    render();
    toast(`${loaded.length} ${loaded.length === 1 ? 'foto adicionada' : 'fotos adicionadas'}`);
  });

  $('add').addEventListener('click', () => { pendingIndex = null; replaceMode = false; fileEl.click(); });

  $('clear').addEventListener('click', () => {
    if (!filledCount()) return;
    if (confirm('Remover todas as fotos?')) { items = []; render(); }
  });
  $('cuts').addEventListener('change', render);

  /* ---------- prévia ---------- */
  const ICON_PLUS = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';

  function render() {
    const pages = pageCount();
    sheetsEl.innerHTML = '';
    for (let p = 0; p < pages; p++) {
      const wrap = document.createElement('section');
      if (pages > 1) {
        const l = document.createElement('p'); l.className = 'sheet-label'; l.textContent = `Folha ${p + 1} de ${pages}`;
        wrap.appendChild(l);
      }
      const paper = document.createElement('div');
      paper.className = 'paper' + ($('cuts').checked ? ' cuts' : '');
      for (let k = 0; k < PER_PAGE; k++) {
        const i = p * PER_PAGE + k, pos = slotPos(i);
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'slot' + (items[i] ? '' : ' empty');
        b.style.left = (pos.x / A4.w * 100) + '%';
        b.style.top = (pos.y / A4.h * 100) + '%';
        b.setAttribute('aria-label', items[i] ? `Ajustar foto ${i + 1}` : `Adicionar foto no espaço ${i + 1}`);
        if (items[i]) {
          const c = document.createElement('canvas'); c.width = c.height = 240;
          drawItem(c.getContext('2d'), items[i], 240);
          b.appendChild(c);
          b.addEventListener('click', () => openEditor(i));
        } else {
          b.innerHTML = ICON_PLUS;
          b.addEventListener('click', () => { pendingIndex = i; replaceMode = false; fileEl.click(); });
        }
        paper.appendChild(b);
      }
      wrap.appendChild(paper);
      sheetsEl.appendChild(wrap);
    }
    const n = filledCount();
    $('count').textContent = `${n} ${n === 1 ? 'foto' : 'fotos'}` + (pages > 1 ? ` · ${pages} folhas` : '');
    $('export').disabled = n === 0;
    $('exportLabel').textContent = pages > 1 ? 'Baixar PDF' : 'Baixar PDF';
  }

  /* ---------- editor ---------- */
  const edCtx = ed.canvas.getContext('2d');
  const edDraw = () => { const it = items[ed.idx]; if (it) drawItem(edCtx, it, ed.canvas.width); };
  const refreshThumb = () => render();

  function openEditor(i) {
    if (!items[i]) return;
    ed.idx = i;
    $('editor').classList.add('open');
    document.body.style.overflow = 'hidden';
    $('edTitle').textContent = `Foto ${i + 1}`;
    ed.zoom.value = items[i].zoom;
    $('prev').disabled = !items.slice(0, i).some(Boolean);
    $('next').disabled = !items.slice(i + 1).some(Boolean);
    edDraw();
  }
  function closeEditor() {
    $('editor').classList.remove('open');
    document.body.style.overflow = '';
    ed.idx = -1;
    refreshThumb();
  }
  function step(dir) {
    let i = ed.idx + dir;
    while (i >= 0 && i < items.length && !items[i]) i += dir;
    if (i >= 0 && i < items.length && items[i]) openEditor(i);
  }

  $('done').addEventListener('click', closeEditor);
  $('prev').addEventListener('click', () => step(-1));
  $('next').addEventListener('click', () => step(1));
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ed.idx >= 0) closeEditor(); });

  ed.zoom.addEventListener('input', () => {
    const it = items[ed.idx]; if (!it) return;
    const prev = it.zoom; it.zoom = parseFloat(ed.zoom.value);
    const r = it.zoom / prev; it.ox *= r; it.oy *= r;
    clamp(it); edDraw();
  });
  $('fill').addEventListener('click', () => {
    const it = items[ed.idx]; it.zoom = 1; it.ox = it.oy = 0; ed.zoom.value = 1; edDraw();
  });
  $('rotate').addEventListener('click', () => {
    const it = items[ed.idx]; it.rot = (it.rot + 1) % 4; it.ox = it.oy = 0; it.zoom = 1; ed.zoom.value = 1; edDraw();
  });
  $('guide').addEventListener('click', e => {
    const on = ed.frame.classList.toggle('show-guide');
    e.currentTarget.setAttribute('aria-pressed', on);
  });
  $('swap').addEventListener('click', () => { pendingIndex = ed.idx; replaceMode = true; fileEl.click(); });
  $('remove').addEventListener('click', () => {
    items[ed.idx] = undefined;
    while (items.length && !items[items.length - 1]) items.pop();
    closeEditor();
  });

  // Arrastar (1 dedo) e pinça (2 dedos) / roda do mouse
  const pointers = new Map();
  let pinch = null;
  ed.canvas.addEventListener('pointerdown', e => {
    ed.canvas.setPointerCapture(e.pointerId);
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    if (pointers.size === 2) pinch = { d: dist(), z: items[ed.idx].zoom };
  });
  ed.canvas.addEventListener('pointermove', e => {
    const p = pointers.get(e.pointerId), it = items[ed.idx];
    if (!p || !it) return;
    const size = ed.canvas.getBoundingClientRect().width;
    if (pointers.size === 1) {
      it.ox += (e.clientX - p.x) / size;
      it.oy += (e.clientY - p.y) / size;
    }
    p.x = e.clientX; p.y = e.clientY;
    if (pointers.size === 2 && pinch) {
      const prev = it.zoom;
      it.zoom = Math.min(4, Math.max(0.2, pinch.z * dist() / pinch.d));
      const r = it.zoom / prev; it.ox *= r; it.oy *= r;
      ed.zoom.value = it.zoom;
    }
    clamp(it); edDraw();
  });
  const endPtr = e => { pointers.delete(e.pointerId); pinch = null; };
  ed.canvas.addEventListener('pointerup', endPtr);
  ed.canvas.addEventListener('pointercancel', endPtr);
  const dist = () => { const [a, b] = [...pointers.values()]; return Math.hypot(a.x - b.x, a.y - b.y) || 1; };
  ed.canvas.addEventListener('wheel', e => {
    e.preventDefault();
    const it = items[ed.idx], prev = it.zoom;
    it.zoom = Math.min(4, Math.max(0.2, it.zoom * (e.deltaY < 0 ? 1.06 : 1 / 1.06)));
    const r = it.zoom / prev; it.ox *= r; it.oy *= r;
    ed.zoom.value = it.zoom; clamp(it); edDraw();
  }, { passive: false });

  /* ---------- exportar PDF ---------- */
  const DPI = 300, PX = mm => Math.round(mm / 25.4 * DPI);

  function renderPage(p) {
    const c = document.createElement('canvas');
    c.width = PX(A4.w); c.height = PX(A4.h);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    const S = PX(CELL);
    for (let k = 0; k < PER_PAGE; k++) {
      const i = p * PER_PAGE + k, it = items[i], pos = slotPos(i);
      const x = Math.round(PX(pos.x)), y = Math.round(PX(pos.y));
      if (it) {
        const t = document.createElement('canvas'); t.width = t.height = S;
        drawItem(t.getContext('2d'), it, S);
        ctx.drawImage(t, x, y);
      }
      if ($('cuts').checked && it) {
        // linha fina logo FORA do quadrado de 50 mm, sem invadir a foto
        ctx.strokeStyle = '#8B8B8B'; ctx.lineWidth = 2;
        ctx.strokeRect(x - 1.5, y - 1.5, S + 3, S + 3);
      }
    }
    return c;
  }

  const canvasToJpeg = c => new Promise(res => c.toBlob(b => b.arrayBuffer().then(buf => res(new Uint8Array(buf))), 'image/jpeg', 0.93));

  /** PDF mínimo: uma imagem JPEG por página A4, sem dependências. */
  function buildPdf(pages) {
    const enc = new TextEncoder(), parts = [], offsets = [];
    let len = 0;
    const push = d => { const b = typeof d === 'string' ? enc.encode(d) : d; parts.push(b); len += b.length; };
    const begin = id => { offsets[id] = len; push(`${id} 0 obj\n`); };
    const W = 595.28, H = 841.89, n = pages.length;

    push('%PDF-1.4\n');
    begin(1); push('<< /Type /Catalog /Pages 2 0 R >>\nendobj\n');
    begin(2); push(`<< /Type /Pages /Count ${n} /Kids [${pages.map((_, i) => `${3 + i * 3} 0 R`).join(' ')}] >>\nendobj\n`);
    pages.forEach((pg, i) => {
      const pid = 3 + i * 3, cid = pid + 1, iid = pid + 2;
      begin(pid);
      push(`<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 ${iid} 0 R >> >> /Contents ${cid} 0 R >>\nendobj\n`);
      const content = `q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`;
      begin(cid); push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream\nendobj\n`);
      begin(iid);
      push(`<< /Type /XObject /Subtype /Image /Width ${pg.w} /Height ${pg.h} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${pg.bytes.length} >>\nstream\n`);
      push(pg.bytes); push('\nendstream\nendobj\n');
    });
    const total = 3 + n * 3, xref = len;
    push(`xref\n0 ${total}\n0000000000 65535 f \n`);
    for (let id = 1; id < total; id++) push(String(offsets[id]).padStart(10, '0') + ' 00000 n \n');
    push(`trailer\n<< /Size ${total} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`);
    return new Blob(parts, { type: 'application/pdf' });
  }

  $('export').addEventListener('click', async () => {
    const btn = $('export'), label = $('exportLabel');
    btn.disabled = true; label.textContent = 'Gerando…';
    try {
      await new Promise(r => setTimeout(r, 30));
      const out = [];
      for (let p = 0; p < pageCount(); p++) {
        const c = renderPage(p);
        out.push({ w: c.width, h: c.height, bytes: await canvasToJpeg(c) });
        c.width = c.height = 0;
      }
      const blob = buildPdf(out);
      const file = new File([blob], 'botons-5x5-A4.pdf', { type: 'application/pdf' });
      const touch = matchMedia('(pointer:coarse)').matches;
      if (touch && navigator.canShare && navigator.canShare({ files: [file] })) {
        try { await navigator.share({ files: [file], title: 'Botons 5×5' }); return; }
        catch (e) { if (e && e.name === 'AbortError') return; }
      }
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 30000);
    } catch (err) {
      console.error(err);
      toast('Erro ao gerar o PDF. Tente com menos fotos.');
    } finally {
      btn.disabled = filledCount() === 0; label.textContent = 'Baixar PDF';
    }
  });

  render();
})();
</script>
</body>
</html>
